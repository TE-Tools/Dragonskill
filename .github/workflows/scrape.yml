name: Auto-Scrape Guide Data

on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Scraper-Abhängigkeiten installieren
        working-directory: scraper
        run: npm install

      - name: Alle Specs scrapen
        working-directory: scraper
        run: node scrape-all.js --list spec-list.json --outDir data-raw

      - name: JSON zu Lua konvertieren
        working-directory: scraper
        run: node build-data.js --dataDir data-raw --out ../DragonSkill/Data/GuideData.lua

      - name: Änderungen committen (falls vorhanden)
        run: |
          git config user.name "dragon-skill-bot"
          git config user.email "actions@github.com"
          git add DragonSkill/Data/GuideData.lua scraper/data-raw || true
          if git diff --cached --quiet; then
            echo "Keine Änderungen an den Guide-Daten."
          else
            git commit -m "chore: automatischer Guide-Daten Scrape ($(date -u +%Y-%m-%d))"
            git push origin HEAD:main
          fi
